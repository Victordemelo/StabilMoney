name: CI

# Roda a suíte de testes a cada push na main e em todo pull request.
#
# A suíte roda DUAS vezes: no job `testes`, em sqlite em memória (o que o
# phpunit.xml define — rápido, e é o que roda na máquina de quem desenvolve), e
# no job `mysql`, no MySQL 8.0 de produção. O porquê do segundo está no comentário
# dele, mais abaixo.
#
# Por que NÃO tem `npm run build`: o tests/TestCase.php chama withoutVite(),
# então nenhuma view depende de public/build/manifest.json durante os testes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Um push novo cancela a execução anterior do mesmo branch (economiza minutos).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: Suíte de testes (PHP 8.4 · sqlite em memória)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # As mesmas do Dockerfile + sqlite (o container usa MySQL; o CI usa sqlite).
          extensions: mbstring, bcmath, exif, gd, pdo_sqlite, sqlite3, zip, curl, dom, fileinfo
          coverage: none
          ini-values: memory_limit=512M

      # Precisa existir ANTES do composer install: os scripts do Composer chamam
      # `artisan package:discover`, e o artisan carrega o .env.
      - name: Preparar o .env
        run: cp .env.example .env

      - name: Descobrir o diretório de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restaurar o cache do Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.4-

      # --no-progress deixa o log limpo; as dependências de DEV entram de propósito
      # (phpunit, faker e collision vivem lá).
      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Gerar a APP_KEY
        run: php artisan key:generate

      - name: Rodar a suíte
        run: php artisan test

      # Compila TODAS as views Blade: pega erro de sintaxe em tela que nenhum teste
      # renderiza. Roda depois dos testes para não interferir neles.
      - name: Validar a sintaxe das views
        run: php artisan view:cache

  # ------------------------------------------------------------------------
  # A MESMA suíte no MySQL 8.0 — LIGADO em 22/09/2026.
  #
  # Produção é MySQL, e o sqlite do job `testes` deixa passar justamente o que
  # só o MySQL faz:
  #   - tamanho de coluna: `varchar(255)` estourado é erro 1406 no MySQL e passa
  #     calado no sqlite. Já escondeu defeito duas vezes (`terms_accepted_ip` e
  #     `two_factor_secret`, colunas cifradas que não cabiam);
  #   - `lockForUpdate`: o sqlite compila o lock para NADA, então a trava de gasto
  #     (FundingService) nunca é exercitada com o lock de verdade;
  #   - modo estrito, `ONLY_FULL_GROUP_BY`, colação que não diferencia maiúsculas
  #     e DDL que faz commit implícito no meio da transação do teste.
  #
  # As variáveis vão no `env` do passo, e não no .env, de propósito: o
  # phpunit.xml não usa force="true", então o que vem do ambiente do processo
  # VENCE o `<env name="DB_CONNECTION" value="sqlite"/>` — é isso que troca o
  # banco. (O `artisan test` só apaga do ambiente o que ele mesmo leu do .env.)
  #
  # O banco se chama `stabilmoney_testes`, e não `stabilmoney`, porque o
  # tests/TestCase.php RECUSA subir a suíte no nome do banco de desenvolvimento:
  # o RefreshDatabase roda `migrate:fresh`, e o banco de dev já foi zerado uma vez
  # por um comando que caiu no lugar errado.
  #
  # Antes de ligar: a suíte inteira verde em 3 rodadas seguidas contra o MySQL
  # 8.0 do docker-compose. Os 7 testes que só passavam no sqlite (M-3 da
  # auditoria de 05/09/2026) procuravam SQL com as aspas do sqlite e, no MySQL,
  # nunca disparavam; hoje comparam pela gramática do banco em uso.
  #
  # Quando SÓ este job reprovar: é defeito que o sqlite esconde — o mais comum é
  # texto maior que a coluna, ou uma consulta que depende da ordem sem ORDER BY.
  # Reproduza localmente num banco de testes com nome próprio (nunca no de dev):
  #   docker compose exec -T -e DB_CONNECTION=mysql -e DB_DATABASE=stabilmoney_testes app php artisan test
  # (o banco precisa existir e o usuário do app precisa de grant nele).
  mysql:
    name: Suíte de testes (PHP 8.4 · MySQL 8.0)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        # A mesma imagem do docker-compose.yml.
        image: mysql:8.0
        env:
          MYSQL_DATABASE: stabilmoney_testes
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          # As mesmas do Dockerfile (que é MySQL).
          extensions: mbstring, bcmath, exif, gd, pdo_mysql, zip, curl, dom, fileinfo
          coverage: none
          ini-values: memory_limit=512M

      - name: Preparar o .env
        run: cp .env.example .env

      - name: Descobrir o diretório de cache do Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Restaurar o cache do Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-php8.4-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            composer-${{ runner.os }}-php8.4-

      - name: Instalar dependências PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Gerar a APP_KEY
        run: php artisan key:generate

      - name: Rodar a suíte no MySQL
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: stabilmoney_testes
          DB_USERNAME: root
          DB_PASSWORD: root
        run: php artisan test

  # ------------------------------------------------------------------------
  # Formatação (Pint) — LIGADO em 06/08/2026.
  #
  # Ficou desligado até aqui porque o baseline reprovava 94 arquivos: um CI
  # vermelho permanente treina todo mundo a ignorar o resultado, que é o oposto
  # do que ele serve. O que destravou foi a rodada de formatação num commit só,
  # com a suíte verificada verde antes e depois (934 testes).
  #
  # `lang/` fica de fora pelo pint.json — é gerado pelo laravel-lang e ninguém
  # edita à mão.
  #
  # Quando este job reprovar: `docker compose exec app ./vendor/bin/pint` e
  # commitar o resultado. Ele nunca aponta erro de lógica, só de estilo.
  formatacao:
    name: Formatação (Pint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: ./vendor/bin/pint --test

  # ------------------------------------------------------------------------
  # Testes de JavaScript (Vitest) — LIGADO em 16/09/2026.
  #
  # Até aqui o JS não tinha rede de segurança nenhuma no CI — e é nele que
  # vivem a máscara de TODO campo de dinheiro (money.js) e a guarda que impede
  # a navegação por pjax de virar bypass da CSP (nav.js). Um teste que só roda
  # quando alguém lembra de rodar não protege nada.
  #
  # `npm ci`, nunca `npm install`: instala EXATAMENTE o package-lock.json, as
  # mesmas versões testadas localmente. Verificado antes de ligar, num container
  # Linux x64 a partir de um clone limpo — lockfile gerado em Mac ARM às vezes
  # omite os binários nativos de Linux (rollup, esbuild, sharp) e quebra aqui.
  #
  # Node 24 = a mesma major do host de desenvolvimento. O package.json não tem
  # `engines`, então fixar aqui evita que o runner troque de versão por baixo.
  #
  # Os e2e do Playwright NÃO rodam aqui: precisam do app de pé, com banco e
  # e-mail, e cadastram usuários de verdade.
  javascript:
    name: Testes de JavaScript (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências JS
        run: npm ci

      - name: Rodar os testes de JavaScript
        run: npm run test:js

  # ------------------------------------------------------------------------
  # Auditoria de segurança das dependências PHP (composer audit) — LIGADO em
  # 16/09/2026.
  #
  # Nasceu de uma rodada que achou 18 advisories (9 de severidade alta) em três
  # pacotes que o composer.json nem cita: guzzlehttp/guzzle, guzzlehttp/psr7 e
  # league/commonmark chegam pelo laravel/framework. Dependência transitiva
  # envelhece sem ninguém ver — só uma checagem automática vê.
  #
  # `--locked` audita o composer.lock sem instalar o vendor: não precisa de .env,
  # de extensão nem de `composer install`, e roda em segundos. E é o lock que
  # decide o que vai para produção, então é ele que interessa.
  #
  # Dependências de DEV entram de propósito (sem `--no-dev`). Hoje não existe
  # imagem de produção (ver o .dockerignore): o container monta o projeto com o
  # vendor INTEIRO, e o plano para a VPS é subir o mesmo docker-compose — ou
  # seja, phpunit, collision e companhia iriam junto. E mesmo quando o deploy
  # usar `--no-dev`, esses pacotes continuam rodando neste CI e na máquina de
  # quem desenvolve.
  #
  # `--abandoned=report`, e não o `fail` que é o padrão do Composer. Pacote
  # abandonado não é falha explorável, e sair dele é uma migração de biblioteca,
  # não um `composer update` — reprovar por isso deixaria o job vermelho por
  # semanas, e um CI vermelho permanente treina todo mundo a ignorar o
  # resultado. Assim, vermelho aqui significa uma coisa só: vulnerabilidade
  # conhecida, aja agora. O abandono continua aparecendo no log. O valor vai
  # explícito porque o padrão já mudou entre versões (`report` até o Composer
  # 2.6, `fail` desde a 2.7).
  #
  # ⚠️ Este job pode ficar vermelho SEM mudança nenhuma de código: basta sair um
  # advisory novo para uma versão que já está no lock. Não é culpa do commit que
  # disparou o CI — e desligar o job não é a saída. Quando acontecer:
  #   1. Ler no log o pacote, as versões afetadas e o link do advisory.
  #   2. `docker compose exec app composer update <pacote>`. Se o Composer
  #      recusar porque uma dependência ficou presa no lock, acrescente-a à
  #      lista (ou use `--with-all-dependencies`, que também pode subir outros
  #      pacotes sem necessidade). Conferir no diff do composer.lock que o
  #      laravel/framework continua na 12.x e que nenhum pacote pulou de MAJOR.
  #   3. `docker compose exec app php artisan test` verde, e commitar o lock.
  #   4. Ainda não existe versão corrigida, ou o advisory comprovadamente não
  #      alcança o app? Registrar a exceção no composer.json, em
  #      `config.audit.ignore`, no formato {"ID-do-advisory": "motivo e data"} —
  #      o Composer mostra o motivo no log —, e revisitar quando sair a correção.
  #
  # Limite conhecido: só roda em push e PR. Advisory publicado numa semana sem
  # commits só aparece no push seguinte.
  auditoria:
    name: Auditoria de dependências PHP (composer audit)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # Só para ter o Composer: o audit não executa código do app, então não
      # precisa das extensões nem do memory_limit do job de testes.
      - name: Instalar PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Auditar o composer.lock
        run: composer audit --locked --abandoned=report --no-interaction

  # ------------------------------------------------------------------------
  # Scripts de backup e restauração (bash) — LIGADO em 22/09/2026.
  #
  # scripts/backup-db.sh e scripts/restore-db.sh são a rede de segurança de um
  # app com dinheiro de verdade, e a auditoria de 06/09/2026 provou que eles
  # podiam PIORAR um incidente: restaurar um arquivo cortado apagava o banco e
  # ainda imprimia "OK" (B-1 a B-5 em docs/auditoria-volume-e-backup-2026-09-06.md).
  # Script que só roda no dia do desastre precisa de teste que rode todo dia.
  #
  # O teste roda os scripts DE VERDADE contra um `docker` falso
  # (tests/scripts/docker-falso.sh), que guarda o "banco" em arquivos e registra
  # cada operação — é assim que ele prova que arquivo ruim não encosta no banco.
  # Por isso não precisa de Docker nem de MySQL aqui. (O runner TEM docker de
  # verdade; o teste confere que o falso está na frente do PATH e aborta se não
  # estiver.)
  #
  # Roda no Ubuntu de propósito: aqui o `awk` é o mawk e as ferramentas são as
  # GNU — as mesmas da VPS —, enquanto no Mac de quem desenvolve são o bash 3.2 e
  # as ferramentas BSD. O teste passa nos dois.
  scripts:
    name: Scripts de backup e restauração (bash)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Testar backup-db.sh e restore-db.sh (sem Docker, com docker falso)
        run: bash tests/scripts/backup-restore.test.sh
