<!DOCTYPE html>
<!--
  Fonte da imagem de prévia de link (Open Graph) — public/assets/og-stabilmoney-2.jpg, 1200×630.
  Identidade de out/2026 (design_stabilmoney/): fundo mata, o símbolo num selo branco, o nome em
  Bricolage Grotesque com "Money" em lima, e uma frase curta.

  TUDO o que importa fica no QUADRADO CENTRAL (x de 285 a 915): na prévia pequena o WhatsApp
  recorta a imagem num quadrado no meio — a versão anterior (o painel do login, com o texto à
  esquerda) aparecia cortada no meio das palavras. Gere de novo, da raiz do repositório:

    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless=new --disable-gpu \
      --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
      --virtual-time-budget=8000 --screenshot=/tmp/og.png "file://$PWD/resources/og/og-stabilmoney.html"
    sips -s format jpeg -s formatOptions 88 /tmp/og.png --out public/assets/og-stabilmoney-2.jpg

  Fique abaixo de 300 KB (o WhatsApp costuma não mostrar prévia maior). As redes sociais
  guardam a imagem pela URL: trocou o conteúdo, troque também o NOME do arquivo em config/seo.php.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700..800&family=Geist:wght@400..600&display=block" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #032628; color: #fff; font-family: 'Geist', system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    position: relative;
  }
  /* Dois arcos finos de lima nas laterais: dão forma à versão larga e somem no recorte quadrado. */
  .arco { position: absolute; width: 520px; height: 520px; border-radius: 50%; border: 2px solid rgba(159, 232, 112, .16); }
  .arco.e { left: -330px; top: 55px; }
  .arco.d { right: -330px; top: 55px; }
  .selo { width: 132px; height: 132px; border-radius: 34px; background: #fff; display: grid; place-items: center;
    box-shadow: 0 24px 60px -20px rgba(0, 0, 0, .55); }
  .selo img { width: 98px; height: 98px; display: block; }
  h1 { margin: 34px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 96px;
    line-height: .9; letter-spacing: -.045em; }
  h1 b { color: #9FE870; font-weight: 800; }
  p { margin: 22px 0 0; font-size: 30px; font-weight: 500; color: #B9CBC5; letter-spacing: -.01em; }
</style>
</head>
<body>
  <span class="arco e" aria-hidden="true"></span>
  <span class="arco d" aria-hidden="true"></span>
  <div class="selo"><img src="../../public/assets/stabilmoney-mark.png" alt=""></div>
  <h1>Stabil<b>Money</b></h1>
  <p>Controle financeiro da família</p>
</body>
</html>
