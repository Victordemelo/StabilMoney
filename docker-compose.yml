name: stabilmoney

services:
  # Nosso contêiner da aplicação Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stabilmoney_app
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - .:/var/www/html
    depends_on:
      - db

  # Nosso contêiner do banco de dados MySQL
  db:
    image: mysql:8.0
    container_name: stabilmoney_db
    restart: unless-stopped
    environment:
      # Credenciais vêm do .env (gitignorado). Os defaults abaixo são os valores
      # históricos deste ambiente de dev — sem eles, quem clonar o repo não sobe.
      # ATENÇÃO: o MySQL só cria o usuário no PRIMEIRO boot do volume. Trocar a
      # senha aqui não muda o banco existente; para valer é preciso alinhar o .env
      # e recriar o volume (`docker compose down -v` APAGA os dados) ou rodar
      # ALTER USER dentro do container.
      MYSQL_DATABASE: ${DB_DATABASE:-stabilmoney}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_USER: ${DB_USERNAME:-user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      # Bind explícito em 127.0.0.1: com "3307:3306" o Docker publica em 0.0.0.0 e
      # qualquer dispositivo da mesma rede Wi-Fi acessa o banco (e o CLAUDE.md manda
      # testar o app pelo celular na mesma rede). O app NÃO usa esta porta — fala
      # com db:3306 pela rede interna do compose; ela existe só para DBeaver/TablePlus.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql

# Volume para garantir que os dados do banco não sumam se o contêiner cair
volumes:
  db_data: