# =============================================================================
# O `server` PADRÃO do nginx do host: quem chega com um Host (ou um SNI) que não é de
# nenhum site da VPS não recebe nada.
#
#   /etc/nginx/sites-available/00-host-desconhecido   ← este arquivo
#   /etc/nginx/sites-enabled/00-host-desconhecido     ← link para ele
#
# Sem um `default_server` explícito, o nginx entrega o Host desconhecido ao PRIMEIRO
# server da porta — em ordem alfabética, `stabilmoney...` vem antes de
# `victordemelo...`. Seria o app recebendo, por exemplo, um "esqueci a senha" com
# `Host: atacante.com`, e mandando para a vítima um link para atacante.com com o token
# dentro (o "password reset poisoning"). O app também se protege sozinho (em
# produção, Host diferente do APP_URL recebe 400 e todo link sai do APP_URL — ver
# app/Support/EnderecoPublico.php), mas este é o lugar certo para barrar primeiro:
# a requisição nem chega ao PHP.
#
# ⚠️ Só pode existir UM `default_server` por porta. Antes de instalar, confira com
#   sudo nginx -T 2>/dev/null | grep -n default_server
# O `default` que vem com o Ubuntu (a página "Welcome to nginx!") tem um na porta 80:
# apague o link dele (sudo rm /etc/nginx/sites-enabled/default). Se for o do
# portfólio, tire o `default_server` de lá — ele tem o próprio server_name e não
# precisa ser o padrão. O passo a passo está no guia.
# =============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    server_tokens off;

    # Na 443, recusa o próprio aperto de mão TLS: quem varre IPs atrás de sites (sem
    # SNI, ou com um nome qualquer) não recebe nem um certificado — que diria quais
    # domínios moram nesta VPS e ajudaria a achar a origem por trás da Cloudflare.
    # Precisa do nginx 1.19.4 ou mais novo (o do Ubuntu 24.04 é o 1.24).
    ssl_reject_handshake on;

    # 444: o nginx fecha a conexão sem mandar resposta nenhuma.
    return 444;
}
