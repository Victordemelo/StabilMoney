# =============================================================================
# Stabil Money — o site no nginx do HOST (VPS Oracle, Ubuntu 24.04).
#
# Instalação e o porquê de cada peça: docs/deploy-oracle-cloudflare.md.
#
#   /etc/nginx/sites-available/stabilmoney.victordemelo.com.br   ← este arquivo
#   /etc/nginx/sites-enabled/stabilmoney.victordemelo.com.br     ← link para ele
#
# ESTE arquivo é a verdade: o certificado vem do `certbot certonly --nginx`, que
# só OBTÉM o certificado e não edita nada aqui. Mudou algo? Mude no repositório,
# copie de novo, `sudo nginx -t` e `sudo systemctl reload nginx`.
#
# O caminho da requisição:
#
#   visitante → Cloudflare (HTTPS, certificado da Cloudflare)
#             → este nginx :443 (HTTPS, certificado do Let's Encrypt — "Full (strict)")
#             → 127.0.0.1:8081 (o container `app`: Apache + PHP, http)
#
# Precisa de dois arquivos que moram fora daqui (ver o guia):
#   - /etc/nginx/snippets/cloudflare-ip-real.conf  (o IP real do visitante)
#   - /etc/nginx/conf.d/cloudflare-origem.conf     (a variável $stabilmoney_via_cloudflare)
# =============================================================================

# -----------------------------------------------------------------------------
# Porta 80 — só o desafio do Let's Encrypt e o redirecionamento para https.
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name stabilmoney.victordemelo.com.br;

    server_tokens off;
    include snippets/cloudflare-ip-real.conf;

    access_log /var/log/nginx/stabilmoney.access.log;
    error_log  /var/log/nginx/stabilmoney.error.log;

    # O redirecionamento fica DENTRO do `location /`, e não num `return` solto no
    # server: durante a validação, o certbot põe aqui um location EXATO para
    # /.well-known/acme-challenge/<token>, e location exato vence o `location /`.
    # O desafio chega pela Cloudflare, na porta 80, em http — é por isso que esta
    # porta existe (ver "Let's Encrypt atrás da Cloudflare" no guia).
    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# Porta 443 — o app.
# -----------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name stabilmoney.victordemelo.com.br;

    server_tokens off;

    # Let's Encrypt, renovado sozinho pelo certbot (o --deploy-hook do guia recarrega
    # o nginx a cada renovação). É ele que a Cloudflare confere no modo "Full (strict)":
    # certificado vencido aqui = erro 526 para todo visitante.
    ssl_certificate     /etc/letsencrypt/live/stabilmoney.victordemelo.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stabilmoney.victordemelo.com.br/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:stabilmoney_ssl:10m;
    ssl_session_timeout 1d;

    # O IP real do visitante: a conexão vem de um IP da Cloudflare, e o do visitante
    # está no cabeçalho CF-Connecting-IP. O nginx só acredita nesse cabeçalho quando a
    # conexão vem das faixas da Cloudflare (set_real_ip_from) — de qualquer outro lugar,
    # o cabeçalho é ignorado e $remote_addr fica sendo quem conectou.
    #
    # Incluído AQUI DENTRO (contexto do server) de propósito: o nginx só acusa diretiva
    # duplicada no MESMO contexto, então isto nunca conflita com o real_ip que o
    # portfólio já tenha — nem no http {}, nem no server dele — e vale para este site
    # mesmo que o do portfólio more só no server do portfólio.
    include snippets/cloudflare-ip-real.conf;

    access_log /var/log/nginx/stabilmoney.access.log;
    error_log  /var/log/nginx/stabilmoney.error.log;

    # Só a Cloudflare fala com este site. Quem descobre o IP da VPS e se conecta
    # direto pularia a proteção dela e poderia mandar o Host que quisesse: a conexão é
    # fechada sem resposta (444). $stabilmoney_via_cloudflare olha o endereço ORIGINAL
    # da conexão ($realip_remote_addr), não o do visitante — ver cloudflare-origem.conf.
    # ⚠️ Com isto ligado, pôr o registro DNS em "DNS only" (nuvem cinza) derruba o site.
    if ($stabilmoney_via_cloudflare = 0) {
        return 444;
    }

    # Igual ao post_max_size do PHP (12M, no Dockerfile): todo upload que o app aceita
    # passa, e o que o PHP recusaria nem chega a ele. O padrão do nginx é 1m — a foto
    # de perfil de 1,5 MB que o app aceita (limite 2 MB) levaria 413 aqui.
    client_max_body_size 12m;

    location / {
        # 8081 = o HTTP_PORT do .env (docker-compose.prod.yml). A 8080 é do portfólio.
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # O que o Laravel precisa saber da requisição original. Ele só acredita nestes
        # cabeçalhos porque vêm do gateway da rede Docker (TRUSTED_PROXIES=172.16.80.1),
        # e cada um é REESCRITO aqui — nada do que o visitante mandou passa adiante:
        #  - X-Forwarded-For: só o IP do visitante ($remote_addr, já corrigido pelo
        #    real_ip). NUNCA $proxy_add_x_forwarded_for, que emendaria a lista que o
        #    próprio visitante mandou;
        #  - X-Forwarded-Proto/Port: a requisição original era https, na 443;
        #  - Host e X-Forwarded-Host: o deste site (só o nome dele chega a este server).
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;
        # Apagados (valor vazio = o nginx não repassa): o app não usa nenhum dos dois,
        # e são os que um visitante usaria para tentar ditar o prefixo dos links ou o
        # próprio IP por outro caminho. O Laravel também os ignora (bootstrap/app.php).
        proxy_set_header X-Forwarded-Prefix "";
        proxy_set_header Forwarded          "";

        # A Cloudflare desiste da origem em 100 s (erro 524). Aqui desistimos antes, com
        # um 504 que fica no nosso log. O PHP para em 30 s (max_execution_time).
        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;

        # Os cabeçalhos da resposta do Laravel (CSP com nonce + dois cookies cifrados)
        # passam de 4 KB; com o buffer padrão (uma página de memória), o nginx
        # responderia 502 "upstream sent too big header".
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_busy_buffers_size 32k;
    }
}
