# =============================================================================
# Stabil Money — TEMPORÁRIO: só para emitir o PRIMEIRO certificado do Let's Encrypt.
#
# O arquivo de verdade (stabilmoney.victordemelo.com.br.conf) aponta para
# /etc/letsencrypt/live/stabilmoney.victordemelo.com.br/, que ainda não existe na
# primeira vez — e com um certificado que não existe o `sudo nginx -t` recusa a
# configuração inteira, derrubando também o portfólio no próximo reload. Por isso a
# primeira emissão é em dois passos (docs/deploy-oracle-cloudflare.md, "Certificado"):
#
#   1. este arquivo no lugar do site → `sudo certbot certonly --nginx ...`
#   2. o certificado existe → troca por stabilmoney.victordemelo.com.br.conf
#
# Só a porta 80 e só o server_name: o `certbot certonly --nginx` procura um server com
# este nome, põe nele (por alguns segundos) a resposta do desafio HTTP-01 e tira de
# volta. O resto responde 404 — nada do app fica no ar por aqui.
#
# Depois da primeira emissão este arquivo não é mais usado: a renovação automática
# acha o server da porta 80 do arquivo de verdade.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name stabilmoney.victordemelo.com.br;
    server_tokens off;

    location / {
        return 404;
    }
}
